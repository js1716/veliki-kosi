<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Protokol za akutno hemodializo</title>

<!-- Grist plugin API. If you self-host Grist, change this to <your-grist>/grist-plugin-api.js -->
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
    background: #e9edf1;
    color: #12161a;
  }

  /* ---------- widget chrome ---------- */
  #toolbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px;
    background: #fff;
    border-bottom: 1px solid #ccd3da;
    font-size: 13px;
  }
  #toolbar button {
    font: inherit;
    padding: 5px 12px;
    border: 1px solid #97a3ae;
    border-radius: 4px;
    background: #fff;
    cursor: pointer;
  }
  #toolbar button.primary { background: #16b378; border-color: #12996a; color: #fff; padding: 7px 18px; }
  #toolbar button:disabled { opacity: .5; cursor: default; }
  #toolbar button.armed { background: #e8813a; border-color: #c96a2a; color: #fff; }
  #toolbar button:focus-visible { outline: 2px solid #1a73e8; outline-offset: 1px; }
  #status { margin-left: auto; color: #5a6670; }

  /* The form is never shown on screen — it exists only so the browser has
     something to print. height:0 keeps it laid out (unlike display:none).
     To bring the preview back, delete this rule. */
  #scroller { height: 0; overflow: hidden; padding: 0; }

  #stage { transform-origin: top left; }

  /* ---------- the form pages ---------- */
  /* Each page is the original PDF page rendered at 200 dpi, with the
     filled-in values positioned on top. Coordinates below are in
     millimetres measured from the PDF itself, origin at the page's
     top-left corner. */
  .page {
    position: relative;
    width: 297mm; height: 210mm;
    overflow: hidden;
    background: #fff;
    color: #000;
  }
  .page + .page { margin-top: 12px; }
  /* The original PDF page at 300 dpi. Everything outside the logo is
     neutral grey, so the page layer is stored as 8-bit greyscale and the
     logo is overlaid separately at its exact brand colours.
     <img> is used rather than a CSS background, because background
     images are dropped by default when printing. */
  .bg {
    position: absolute; left: 0; top: 0;
    width: 297mm; height: 210mm;
    display: block;
  }
  .brand {
    position: absolute;
    left: 16.764mm; top: 9.144mm;
    width: 41.233mm; height: 11.176mm;
    display: block;
  }

  .f {
    position: absolute;
    font-weight: 700;
    font-size: 9pt;
    line-height: 1.05;
    white-space: nowrap;
    overflow: hidden;
  }
  .f.wrap { white-space: normal; overflow: visible; }

  .cb {
    position: absolute;
    width: 3mm; height: 3mm;
    text-align: center; line-height: 3mm;
    font-size: 9pt; font-weight: 700;
  }

  #v-navodila div { line-height: 5.6mm; }
  #v-terapija { white-space: pre-wrap; }

  .sig { display: flex; align-items: flex-end; gap: 2mm; }
  .sig img { max-height: 7.5mm; max-width: 40mm; object-fit: contain; }

  /* ---------- print ---------- */
  @page { size: A4 landscape; margin: 0; }
  @media print {
    body { background: #fff; }
    #toolbar { display: none !important; }
    #scroller { height: auto; padding: 0; overflow: visible; }
    #stage { transform: none !important; width: auto !important; height: auto !important; }
    .page { break-after: page; page-break-after: always; margin: 0 !important; }
    .page:last-child { break-after: auto; page-break-after: auto; }
  }
</style>
</head>

    { name: 'Podpis',         title: 'Podpis (slika)',           type: 'Any', optional: true, description: 'Stolpec tipa Attachments, ali besedilo z URL / data: naslovom slike' }
  ];

  /* Prefixes for the six "KLINIČNI PREGLED IN NAVODILA" lines. */
  var NAVODILA_LINES = [
    ['UF',            'UF'],
    ['HCO3',          'HCO3'],
    ['Na',            'Na'],
    ['20-% manitol',  'Manitol'],
    ['Priklop',       'Priklop'],
    ['Drugo:',        'Druga_navodila']
  ];

  var el = function (id) { return document.getElementById(id); };
  var status = el('status');

  /* ------------------------------------------------------------------
     2. Value helpers
  ------------------------------------------------------------------ */
  function raw(record, mappings, key) {
    if (!mappings || !record) { return null; }
    var col = mappings[key];
    if (Array.isArray(col)) { col = col[0]; }
    if (!col) { return null; }
    return record[col];
  }

  /* Grist encoding codes that are definitely not dates — lists,
     references, and error/placeholder markers. */
  var NON_DATE_CODES = { L: 1, R: 1, r: 1, P: 1, C: 1, U: 1, E: 1, S: 1, O: 1 };

  function dateParts(value) {
    var secs = null, tz = 'UTC';
    if (value instanceof Date) {
      secs = value.getTime() / 1000;
    } else if (typeof value === 'number') {
      secs = value;
    } else if (typeof value === 'string' && /^\d{9,11}$/.test(value.trim())) {
      secs = Number(value.trim());
    } else if (Array.isArray(value) && typeof value[0] === 'string' &&
               value[0].length === 1 && !NON_DATE_CODES[value[0]] &&
               typeof value[1] === 'number') {
      // ['d', seconds] = Date, ['D', seconds, timezone] = DateTime.
      secs = value[1];
      if (typeof value[2] === 'string') { tz = value[2]; }
    }
    if (secs === null || !isFinite(secs)) { return null; }
    var dt = new Date(secs * 1000);
    if (isNaN(dt.getTime())) { return null; }

    // A DateTime carries its own timezone; reading it in UTC would roll
    // late-evening sessions over to the next day.
    try {
      var o = {};
      new Intl.DateTimeFormat('en-CA', {
        timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit'
      }).formatToParts(dt).forEach(function (p) { o[p.type] = p.value; });
      if (o.year && o.month && o.day) {
        return { y: +o.year, m: +o.month, d: +o.day };
      }
    } catch (e) { /* unknown timezone — fall through to UTC */ }

    return { y: dt.getUTCFullYear(), m: dt.getUTCMonth() + 1, d: dt.getUTCDate() };
  }

  function text(record, mappings, key) {
    var v = raw(record, mappings, key);
    if (v === null || v === undefined || v === false) { return ''; }
    if (typeof v === 'number') {
      return Number.isInteger(v) ? String(v) : String(v).replace('.', ',');
    }
    if (typeof v === 'object') {
      // Encoded values can turn up on any field if a column of an
      // unexpected type gets mapped. Render the sensible ones.
      if (Array.isArray(v)) {
        var p = dateParts(v);
        if (p) { return p.d + '. ' + p.m + '. ' + p.y; }
        if (v[0] === 'L') {                       // Choice List / Reference List
          return v.slice(1).filter(function (x) {
            return typeof x === 'string' || typeof x === 'number';
          }).join(', ');
        }
      }
      return '';
    }
    return String(v).trim();
  }

  /* Slovenian long form: 25. 11. 2024 */
  function dateText(record, mappings, key) {
    var v = raw(record, mappings, key);
    if (v === null || v === undefined || v === '' || v === false) { return ''; }
    var p = dateParts(v);
    if (p) { return p.d + '. ' + p.m + '. ' + p.y; }
    if (typeof v === 'object') { return ''; }
    return String(v).trim();
  }

  function dateSlug(record, mappings, key) {
    var p = dateParts(raw(record, mappings, key));
    if (p) {
      var pad = function (n) { return (n < 10 ? '0' : '') + n; };
      return p.y + '-' + pad(p.m) + '-' + pad(p.d);
    }
    return dateText(record, mappings, key).replace(/[^\w-]+/g, '');
  }

  function setText(id, value) { el(id).textContent = value || ''; }
  function tick(id, on) { el(id).textContent = on ? '\u2715' : ''; }

  /* ------------------------------------------------------------------
     3. Signature
  ------------------------------------------------------------------ */
  function blobToDataUrl(blob) {
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onload = function () { resolve(fr.result); };
      fr.onerror = function () { reject(new Error('read failed')); };
      fr.readAsDataURL(blob);
    });
  }

  /* Last resort when getAccessToken is missing or refused: build the API
     URL from the Grist page hosting this iframe, authenticated by the
     user's own session cookie. */
  function apiBaseFromReferrer() {
    try {
      if (!document.referrer) { return null; }
      var u = new URL(document.referrer);
      var parts = u.pathname.split('/').filter(Boolean);
      var docId = null;
      var i = parts.indexOf('doc');
      if (i >= 0 && parts[i + 1]) { docId = parts[i + 1]; }
      else if (parts[0] === 'o' && parts[2]) { docId = parts[2]; }
      else if (parts[0]) { docId = parts[0]; }
      return docId ? (u.origin + '/api/docs/' + docId) : null;
    } catch (e) { return null; }
  }

  /* An Attachments cell can arrive as ['L', 3, 7], [3, 7] or 3. */
  function attachmentIds(value) {
    if (value === null || value === undefined || value === '' || value === false) { return []; }
    if (typeof value === 'number') { return [value]; }
    if (Array.isArray(value)) {
      var list = (value[0] === 'L') ? value.slice(1) : value;
      return list.filter(function (x) { return typeof x === 'number' && x > 0; });
    }
    return [];
  }

  /* Each step is traced to the console — look there first if a signature
     ever stops appearing. */
  async function resolveSignature(value) {
    var note = function (m) { console.debug('[podpis]', m); };

    if (typeof value === 'string') {
      var s = value.trim();
      if (!s) { return null; }
      if (s.indexOf('data:') === 0 || s.indexOf('http') === 0) { return s; }
      throw new Error('Stolpec Podpis je besedilo, ki ni slika ali URL.');
    }

    var ids = attachmentIds(value);
    note('ID-ji priponk: ' + (ids.length ? ids.join(', ') : '(brez)'));
    if (!ids.length) { return null; }

    var url = null;
    if (grist.docApi && grist.docApi.getAccessToken) {
      try {
        var tok = await grist.docApi.getAccessToken({ readOnly: true });
        url = tok.baseUrl + '/attachments/' + ids[0] + '/download?auth=' + tok.token;
      } catch (e) {
        note('getAccessToken ni uspel: ' + e.message);
      }
    }
    if (!url) {
      var base = apiBaseFromReferrer();
      if (!base) { throw new Error('Ni dostopa do priponk.'); }
      url = base + '/attachments/' + ids[0] + '/download';
      note('nadomestni naslov prek piškotka');
    }

    try {
      var resp = await fetch(url, { credentials: 'include' });
      if (!resp.ok) { throw new Error('HTTP ' + resp.status); }
      var blob = await resp.blob();
      note('prenos OK: ' + blob.type + ', ' + blob.size + ' B');
      return await blobToDataUrl(blob);
    } catch (e) {
      note('prenos ni uspel (' + e.message + '), poskušam neposredno v <img>');
      return url;
    }
  }

  function awaitImage(img) {
    return new Promise(function (resolve) {
      if (img.complete && img.naturalWidth) { resolve(true); return; }
      img.onload = function () { resolve(true); };
      img.onerror = function () { resolve(false); };
    });
  }

  /* ------------------------------------------------------------------
     4. Render one record onto the form
  ------------------------------------------------------------------ */
  var currentName = 'protokol';
  var lastRecord = null;
  var lastMappings = null;

  async function render(record, mappings) {
    var g = function (k) { return text(record, mappings, k); };

    var pacient = [g('Pacient'), g('Leto_rojstva')].filter(Boolean).join(', ');
    setText('v-pacient', pacient);
    currentName = [
      pacient ? pacient.replace(/[^\w\u00C0-\u017F]+/g, '_') : 'protokol',
      dateSlug(record, mappings, 'Datum_HD')
    ].filter(Boolean).join('_');

    setText('v-datum',      dateText(record, mappings, 'Datum_HD'));
    setText('v-cashd',      g('Cas_HD'));
    setText('v-dializator', g('Dializator'));
    setText('v-ca',         g('Ca'));
    setText('v-k',          g('K'));
    setText('v-temp',       g('Temperatura'));
    setText('v-antikoag',   g('Antikoagulacija'));
    setText('v-tiphd',      g('Tip_HD'));
    setText('v-zapst',      g('Zaporedna_st'));

    // Dial. kat. — value present → DA + write it on the line; empty → NE
    var cvk = g('CVK');
    setText('v-cvk', cvk);
    tick('cb-cvk-da', !!cvk);
    tick('cb-cvk-ne', !cvk);

    // AV fistula — value present → DA, empty → NE
    var avf = g('AVF');
    tick('cb-avf-da', !!avf);
    tick('cb-avf-ne', !avf);

    // Six instruction lines; empty ones are skipped so the block stays tight.
    var box = el('v-navodila');
    box.innerHTML = '';
    NAVODILA_LINES.forEach(function (pair) {
      var v = g(pair[1]);
      if (!v) { return; }
      var d = document.createElement('div');
      d.textContent = pair[0] + ' ' + v;
      box.appendChild(d);
    });

    el('v-terapija').textContent = g('Terapija');
    setText('v-nefrolog', g('Nefrolog'));

    var img = el('v-podpis');
    img.style.display = 'none';
    img.removeAttribute('src');
    status.textContent = '';
    var podpisRaw = raw(record, mappings, 'Podpis');
    if (podpisRaw !== null && podpisRaw !== undefined && podpisRaw !== '') {
      try {
        var src = await resolveSignature(podpisRaw);
        if (src) {
          img.src = src;
          img.style.display = '';
          var ok = await awaitImage(img);
          if (!ok) {
            img.style.display = 'none';
            status.textContent = 'Podpisa ni bilo mogoče prikazati.';
          }
        }
      } catch (e) {
        console.warn('[podpis]', e, 'vrednost celice:', podpisRaw);
        status.textContent = 'Podpis: ' + e.message;
      }
    }
  }

  function clearForm() {
    ['v-pacient','v-datum','v-cashd','v-dializator','v-ca','v-k','v-temp',
     'v-antikoag','v-tiphd','v-zapst','v-nefrolog','v-terapija','v-cvk'].forEach(function (id) {
      el(id).textContent = '';
    });
    el('v-navodila').innerHTML = '';
    ['cb-cvk-da','cb-cvk-ne','cb-avf-da','cb-avf-ne'].forEach(function (id) { tick(id, false); });
    var img = el('v-podpis');
    img.style.display = 'none';
    img.removeAttribute('src');
  }

  /* ------------------------------------------------------------------
     5. Fit the pages into the widget viewport (only when shown)
  ------------------------------------------------------------------ */
  function fit() {
    var stage = el('stage');
    var scroller = el('scroller');
    var page = document.querySelector('.page');
    var avail = scroller.clientWidth;
    var w = page ? page.offsetWidth : 0;
    if (!w || !avail || !scroller.clientHeight) {
      stage.style.transform = 'none';
      stage.style.width = 'auto';
      stage.style.height = 'auto';
      return;
    }
    var scale = Math.min(1, avail / w);
    stage.style.transform = 'scale(' + scale + ')';
    stage.style.width = (w * scale) + 'px';
    stage.style.height = (stage.scrollHeight * scale) + 'px';
  }
  window.addEventListener('resize', fit);

  /* ------------------------------------------------------------------
     6. Export
  ------------------------------------------------------------------ */
  async function downloadPdf() {
    var btn = el('btnPdf');
    btn.disabled = true;
    status.textContent = 'Pripravljam PDF …';
    var stage = el('stage');
    var saved = { t: stage.style.transform, w: stage.style.width, h: stage.style.height };
    stage.style.transform = 'none';
    stage.style.width = 'auto';
    stage.style.height = 'auto';
    try {
      var pages = document.querySelectorAll('.page');
      var pdf = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
      for (var i = 0; i < pages.length; i++) {
        var canvas = await html2canvas(pages[i], {
          scale: 2, backgroundColor: '#ffffff', useCORS: true, logging: false
        });
        if (i > 0) { pdf.addPage('a4', 'landscape'); }
        pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, 297, 210, undefined, 'FAST');
      }
      pdf.save('Protokol_HD_' + currentName + '.pdf');
      status.textContent = '';
    } catch (e) {
      console.error(e);
      status.textContent = 'PDF ni uspel — poskusite Natisni.';
    } finally {
      stage.style.transform = saved.t;
      stage.style.width = saved.w;
      stage.style.height = saved.h;
      btn.disabled = false;
    }
  }

  /* ------------------------------------------------------------------
     7. "Prenesi navodila v novo HD"
     Adds a row to the same table carrying every data column across,
     except Zap. št., Nefrolog and Podpis (left empty) and Datum HD
     (set to today).
  ------------------------------------------------------------------ */
  async function columnMeta(tableId) {
    var tables = await grist.docApi.fetchTable('_grist_Tables');
    var ref = null;
    for (var i = 0; i < tables.id.length; i++) {
      if (tables.tableId[i] === tableId) { ref = tables.id[i]; break; }
    }
    var cols = await grist.docApi.fetchTable('_grist_Tables_column');
    var out = {};
    for (var j = 0; j < cols.id.length; j++) {
      if (cols.parentId[j] !== ref) { continue; }
      // An empty column has isFormula=true with a blank formula and is
      // still writable; a trigger formula has isFormula=false.
      var isRealFormula = !!cols.isFormula[j] && String(cols.formula[j] || '').trim() !== '';
      out[cols.colId[j]] = { type: String(cols.type[j] || ''), writable: !isRealFormula };
    }
    return out;
  }

  function todayFor(type) {
    var now = new Date();
    if (type.indexOf('DateTime') === 0) { return Math.floor(now.getTime() / 1000); }
    if (type === 'Date') {
      // Date columns store UTC midnight of the calendar day.
      return Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) / 1000;
    }
    return now.getDate() + '. ' + (now.getMonth() + 1) + '. ' + now.getFullYear();
  }

  function mappedCol(key) {
    var c = lastMappings ? lastMappings[key] : null;
    if (Array.isArray(c)) { c = c[0]; }
    return c || null;
  }

  async function createNextHd() {
    if (!lastRecord) { throw new Error('Ni izbrane vrstice.'); }
    var datumCol = mappedCol('Datum_HD');
    if (!datumCol) {
      throw new Error('Preslikajte stolpec "Datum HD" — brez njega ni mogoče vpisati datuma.');
    }

    var skip = { id: true, manualSort: true };
    ['Zaporedna_st', 'Nefrolog', 'Podpis'].forEach(function (k) {
      var c = mappedCol(k);
      if (c) { skip[c] = true; }
    });

    var tableId = await grist.getSelectedTableId();
    var meta = await columnMeta(tableId);

    // fetchTable gives storage-form values, which is what a write expects
    // — unlike the encoded values we receive in onRecord.
    var data = await grist.docApi.fetchTable(tableId);
    var idx = data.id.indexOf(lastRecord.id);
    if (idx < 0) { throw new Error('Izbrane vrstice ni bilo mogoče najti v tabeli.'); }

    var fields = {};
    Object.keys(data).forEach(function (colId) {
      if (colId === 'id' || skip[colId]) { return; }
      var m = meta[colId];
      if (!m || !m.writable) { return; }
      fields[colId] = data[colId][idx];
    });
    fields[datumCol] = todayFor((meta[datumCol] && meta[datumCol].type) || '');

    var table = grist.selectedTable || (grist.getTable && grist.getTable());
    if (!table || !table.create) { throw new Error('Pisanje v tabelo ni na voljo.'); }
    var created = await table.create({ fields: fields });
    return (created && created.id) || null;
  }

  /* Two-step click: an accidental duplicate row is worse than one extra
     click. The armed state reverts on its own. */
  (function wireNewHd() {
    var btn = el('btnNew');
    var label = btn.textContent;
    var armed = false;
    var timer = null;

    function disarm() {
      armed = false;
      clearTimeout(timer);
      btn.textContent = label;
      btn.classList.remove('armed');
    }

    btn.addEventListener('click', async function () {
      if (!armed) {
        if (!lastRecord) { status.textContent = 'Ni izbrane vrstice.'; return; }
        armed = true;
        btn.textContent = 'Potrdi: nova HD';
        btn.classList.add('armed');
        status.textContent = 'Kliknite še enkrat za potrditev.';
        timer = setTimeout(function () { disarm(); status.textContent = ''; }, 5000);
        return;
      }
      disarm();
      btn.disabled = true;
      status.textContent = 'Ustvarjam novo HD …';
      try {
        var newId = await createNextHd();
        status.textContent = 'Nova HD ustvarjena' + (newId ? ' (vrstica ' + newId + ')' : '') + '.';
      } catch (e) {
        console.error('[protokol] nova HD:', e);
        status.textContent = 'Napaka: ' + e.message;
      } finally {
        btn.disabled = false;
      }
    });
  })();

  el('btnPdf').addEventListener('click', downloadPdf);
  el('btnPrint').addEventListener('click', function () {
    try { window.focus(); window.print(); }
    catch (e) { status.textContent = 'Tiskanje blokirano — uporabite Prenesi PDF.'; }
  });

  /* ------------------------------------------------------------------
     8. Wire up Grist
  ------------------------------------------------------------------ */
  grist.ready({
    // 'full' is required: attachments (the signature) live outside the
    // mapped table, so a table-scoped access token cannot fetch them.
    requiredAccess: 'full',
    columns: COLUMNS
  });

  grist.onRecord(function (record, mappings) {
    if (!record) { clearForm(); return; }
    lastRecord = record;
    lastMappings = mappings;
    render(record, mappings).then(fit);
  }, { keepEncoded: true });

  grist.onRecords(function (records) {
    if (!records || !records.length) { clearForm(); }
  });

  window.addEventListener('load', function () { setTimeout(fit, 60); });
  fit();
})();
</script>
</body>
</html>
