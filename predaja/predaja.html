<!DOCTYPE html>
<html lang="sl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Predaja</title>

  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>

    /* =========================================================
       GENERAL
       ========================================================= */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      font-family: Arial, Helvetica, sans-serif;

      color: #111827;

      background: #eef0f3;
    }

    body {
      min-height: 100vh;
    }


    /* =========================================================
       TOOLBAR
       ========================================================= */

    .toolbar {
      position: sticky;

      top: 0;

      z-index: 100;

      display: flex;

      align-items: center;

      padding: 10px 14px;

      background: #ffffff;

      border-bottom: 1px solid #d1d5db;
    }

    .toolbar-title {
      margin-right: auto;

      font-size: 14px;

      font-weight: 700;
    }

    .button {
      height: 34px;

      padding: 0 15px;

      border: 0;

      border-radius: 5px;

      font-size: 12px;

      font-weight: 700;

      cursor: pointer;
    }

    .button-print {
      background: #111827;

      color: #ffffff;
    }

    .button-print:hover {
      background: #374151;
    }

    .button-save {
      margin-left: 8px;

      background: #0f766e;

      color: #ffffff;
    }

    .button-save:hover {
      background: #0d9488;
    }

    .button-save:disabled {
      opacity: 0.6;

      cursor: not-allowed;
    }

    .save-status {
      margin-left: 10px;

      font-size: 11px;

      color: #6b7280;
    }


    /* =========================================================
       PAGE PREVIEW
       ========================================================= */

    .page-wrapper {
      padding: 20px;
    }

    .paper {
      width: 100%;

      max-width: 1120px;

      min-height: 790px;

      margin: 0 auto;

      padding: 10mm;

      background: #ffffff;

      box-shadow:
        0 2px 12px rgba(0, 0, 0, 0.10);
    }


    /* =========================================================
       REPORT HEADER
       ========================================================= */

    .report-header {
      display: flex;

      justify-content: space-between;

      align-items: flex-end;

      gap: 20px;

      margin-bottom: 9px;

      padding-bottom: 8px;

      border-bottom: 2px solid #111827;
    }

    .report-title {
      font-size: 20px;

      line-height: 1.15;

      font-weight: 700;
    }

    .report-meta {
      flex-shrink: 0;

      text-align: right;
    }

    .report-date {
      font-size: 9px;

      color: #374151;
    }

    .report-count {
      margin-top: 3px;

      font-size: 8.5px;

      color: #6b7280;
    }


    /* =========================================================
       TABLE
       ========================================================= */

    table {
      width: 100%;

      border-collapse: collapse;

      table-layout: fixed;

      font-size: 11px;
    }


    /*
      Column order:

      Soba              7%
      Ime pacienta     22%
      Leto rojstva      8%
      Datum sprejema   11%
      Dg               22%
      Plan              25%
      R                  5%
    */

    col.room {
      width: 7%;
    }

    col.patient {
      width: 30%;
    }

    col.admission {
      width: 11%;
    }

    col.diagnosis {
      width: 22%;
    }

    col.plan {
      width: 25%;
    }

    col.r {
      width: 5%;
    }


    /* =========================================================
       TABLE HEADER
       ========================================================= */

    thead {
      display: table-header-group;
    }

    thead tr {
      break-inside: avoid;

      page-break-inside: avoid;
    }

    th {
      padding: 6px 5px;

      background: #e5e7eb;

      border: 1px solid #9ca3af;

      color: #111827;

      font-size: 8.5px;

      font-weight: 700;

      line-height: 1.15;

      text-align: left;

      vertical-align: middle;
    }


    /* =========================================================
       TABLE BODY
       ========================================================= */

    td {
      padding: 5px;

      border: 1px solid #d1d5db;

      font-size: 11px;

      line-height: 1.25;

      vertical-align: top;

      overflow-wrap: anywhere;
    }

    tbody tr {
      break-inside: avoid;

      page-break-inside: avoid;
    }

    .patient-name {
      font-weight: 700;
    }

    .room-number {
      font-weight: 700;

      text-align: center;
    }

    .center {
      text-align: center;
    }

    .empty {
      color: #9ca3af;
    }


    /* =========================================================
       THICK ROOM SEPARATOR
       =========================================================

       Applied to the TOP of a row when the room changes.
    */

    tbody tr.room-change td {
      border-top: 3px solid #4b5563;
    }


    /* =========================================================
       EMPTY STATE
       ========================================================= */

    .empty-state {
      padding: 40px 20px;

      text-align: center;

      color: #6b7280;

      font-size: 13px;
    }


    /* =========================================================
       FOOTER
       ========================================================= */

    .report-footer {
      display: flex;

      justify-content: space-between;

      margin-top: 8px;

      padding-top: 6px;

      border-top: 1px solid #d1d5db;

      font-size: 8px;

      color: #6b7280;
    }


    /* =========================================================
       PRINT
       ========================================================= */

    @media print {

      @page {
        size: A4 landscape;

        margin: 10mm;
      }

      html,
      body {
        width: auto;

        margin: 0 !important;

        padding: 0 !important;

        background: #ffffff;
      }

      .toolbar {
        display: none !important;
      }

      .page-wrapper {
        width: auto;

        min-height: auto;

        margin: 0;

        padding: 0;
      }

      .paper {
        width: auto;

        min-height: auto;

        max-width: none;

        margin: 0;

        padding: 0;

        box-shadow: none;

        background: #ffffff;
      }

      thead {
        display: table-header-group;
      }

      tr {
        break-inside: avoid;

        page-break-inside: avoid;
      }

      th {
        background: #e5e7eb !important;

        -webkit-print-color-adjust: exact;

        print-color-adjust: exact;
      }

      /*
        border-collapse can silently drop cell borders that fall
        right at a page break (a known Chrome/print bug). Using
        separate borders with zero spacing avoids that, at the
        cost of slightly doubled lines between cells.
      */

      table {
        border-collapse: separate;

        border-spacing: 0;
      }

      th,
      td {
        border-color: #6b7280 !important;

        -webkit-print-color-adjust: exact;

        print-color-adjust: exact;
      }

      /*
        Preserve the thick room separator when printing.
      */

      tbody tr.room-change td {
        border-top: 3px solid #4b5563 !important;

        -webkit-print-color-adjust: exact;

        print-color-adjust: exact;
      }

    }

  </style>
</head>


<body>


  <!-- =======================================================
       TOOLBAR
       ======================================================== -->

  <div class="toolbar">

    <div class="toolbar-title">
      Seznam pacientov
    </div>

    <button
      id="printButton"
      class="button button-print"
      type="button"
    >
      🖨 Tiskaj / PDF
    </button>

    <button
      id="saveButton"
      class="button button-save"
      type="button"
    >
      💾 Shrani
    </button>

    <span
      id="saveStatus"
      class="save-status"
    ></span>

  </div>


  <!-- =======================================================
       PAGE
       ======================================================== -->

  <div class="page-wrapper">

    <main class="paper">


      <!-- =====================================================
           HEADER
           ====================================================== -->

      <header class="report-header">

        <div>

          <div
            id="reportTitle"
            class="report-title"
          >
            Predaja
          </div>

        </div>


        <div class="report-meta">

          <div
            id="reportDate"
            class="report-date"
          ></div>

          <div
            id="reportCount"
            class="report-count"
          ></div>

        </div>

      </header>


      <!-- =====================================================
           TABLE
           ====================================================== -->

      <table>

        <colgroup>

          <col class="room">

          <col class="patient">

          <col class="admission">

          <col class="diagnosis">

          <col class="plan">

          <col class="r">

        </colgroup>


        <thead>

          <tr>

            <th class="center">
              Soba
            </th>

            <th>
              Pacient
            </th>

            <th>
              Sprejem
            </th>

            <th>
              Dg
            </th>

            <th>
              Plan
            </th>

            <th class="center">
              R
            </th>

          </tr>

        </thead>


        <tbody id="tableBody">
        </tbody>

      </table>


      <!-- EMPTY STATE -->

      <div
        id="emptyState"
        class="empty-state"
        style="display:none;"
      >
        Ni podatkov za prikaz.
      </div>


      <!-- =====================================================
           FOOTER
           ====================================================== -->

      <footer class="report-footer">

        <div>
          Dokument je pripravljen za tisk.
        </div>

        <div id="footerCount"></div>

      </footer>

    </main>

  </div>



  <script>
/* =========================================================
   DEFAULT COLUMN WIDTHS
   ========================================================= */

const DEFAULT_WIDTHS = {

  Soba: 3,

  Ime_pacienta: 14,

  Datum_sprejema: 5,

  Dg: 25,

  Plan: 25,

  R: 3

};


/* =========================================================
   CURRENT COLUMN WIDTHS
   ========================================================= */

let columnWidths = {
  ...DEFAULT_WIDTHS
};


/* =========================================================
   STATE
   ========================================================= */

let allRecords = [];


/* =========================================================
   GRIST INITIALIZATION + COLUMN MAPPING
   ========================================================= */

grist.ready({

  requiredAccess: 'read table',

  columns: [

    {
      name: 'Soba',
      title: 'Soba',
      type: 'Any',
      optional: false
    },

    {
      name: 'Ime_pacienta',
      title: 'Ime pacienta',
      type: 'Text',
      optional: false
    },

    {
      name: 'Leto_rojstva',
      title: 'Leto rojstva',
      type: 'Int',
      optional: false
    },

    {
      name: 'Datum_sprejema',
      title: 'Datum sprejema',
      type: 'Date,DateTime',
      optional: false
    },

    {
      name: 'Dg',
      title: 'DG',
      type: 'Text',
      optional: false
    },

    {
      name: 'Plan',
      title: 'Plan',
      type: 'Text',
      optional: false
    },

    {
      name: 'R',
      title: 'R',
      type: 'Any',
      optional: false
    },

    {
      name: 'Poletaza',
      title: 'Poletaza (za naslov)',
      type: 'Text',
      optional: true
    }

  ],


  /*
    Tell Grist to show an
    "Open configuration" button
    in the Creator Panel.
  */

  onEditOptions: openWidthConfiguration

});


/* =========================================================
   GET VALID WIDTH
   ========================================================= */

function getWidth(
  value,
  fallback
) {

  const number =
    Number(value);


  if (
    Number.isFinite(number) &&
    number > 0
  ) {

    return number;

  }


  return fallback;

}


/* =========================================================
   APPLY COLUMN WIDTHS
   ========================================================= */

function applyColumnWidths() {

  const room =
    getWidth(
      columnWidths.Soba,
      DEFAULT_WIDTHS.Soba
    );


  const patient =
    getWidth(
      columnWidths.Ime_pacienta,
      DEFAULT_WIDTHS.Ime_pacienta
    );


  const admission =
    getWidth(
      columnWidths.Datum_sprejema,
      DEFAULT_WIDTHS.Datum_sprejema
    );


  const diagnosis =
    getWidth(
      columnWidths.Dg,
      DEFAULT_WIDTHS.Dg
    );


  const plan =
    getWidth(
      columnWidths.Plan,
      DEFAULT_WIDTHS.Plan
    );


  const r =
    getWidth(
      columnWidths.R,
      DEFAULT_WIDTHS.R
    );


  const total =
    room +
    patient +
    admission +
    diagnosis +
    plan +
    r;


  /*
    Convert relative weights
    into percentages.
  */

  const widths = {

    room:
      (room / total) * 100,

    patient:
      (patient / total) * 100,

    admission:
      (admission / total) * 100,

    diagnosis:
      (diagnosis / total) * 100,

    plan:
      (plan / total) * 100,

    r:
      (r / total) * 100

  };


  /*
    Update the actual <col> elements.
  */

  const roomCol =
    document.querySelector(
      'col.room'
    );

  const patientCol =
    document.querySelector(
      'col.patient'
    );

  const admissionCol =
    document.querySelector(
      'col.admission'
    );

  const diagnosisCol =
    document.querySelector(
      'col.diagnosis'
    );

  const planCol =
    document.querySelector(
      'col.plan'
    );

  const rCol =
    document.querySelector(
      'col.r'
    );


  if (roomCol) {

    roomCol.style.width =
      `${widths.room}%`;

  }


  if (patientCol) {

    patientCol.style.width =
      `${widths.patient}%`;

  }


  if (admissionCol) {

    admissionCol.style.width =
      `${widths.admission}%`;

  }


  if (diagnosisCol) {

    diagnosisCol.style.width =
      `${widths.diagnosis}%`;

  }


  if (planCol) {

    planCol.style.width =
      `${widths.plan}%`;

  }


  if (rCol) {

    rCol.style.width =
      `${widths.r}%`;

  }

}


/* =========================================================
   CREATE CONFIGURATION PANEL
   ========================================================= */

function openWidthConfiguration() {

  const existing =
    document.getElementById(
      'widthConfiguration'
    );


  if (existing) {

    existing.remove();

  }


  const overlay =
    document.createElement('div');


  overlay.id =
    'widthConfiguration';


  Object.assign(
    overlay.style,
    {

      position: 'fixed',

      inset: '0',

      zIndex: '99999',

      background: 'rgba(0, 0, 0, 0.35)',

      display: 'flex',

      alignItems: 'center',

      justifyContent: 'center',

      fontFamily:
        'Arial, Helvetica, sans-serif'

    }
  );


  const panel =
    document.createElement('div');


  Object.assign(
    panel.style,
    {

      width: '360px',

      maxWidth: 'calc(100vw - 30px)',

      background: '#ffffff',

      borderRadius: '8px',

      boxShadow:
        '0 8px 30px rgba(0,0,0,0.25)',

      padding: '20px',

      color: '#111827'

    }
  );


  const title =
    document.createElement('div');


  title.textContent =
    'Širina stolpcev';


  Object.assign(
    title.style,
    {

      fontSize: '17px',

      fontWeight: '700',

      marginBottom: '6px'

    }
  );


  panel.appendChild(title);


  const explanation =
    document.createElement('div');


  explanation.textContent =
    'Vnesite relativne širine stolpcev. Višja vrednost pomeni širši stolpec.';


  Object.assign(
    explanation.style,
    {

      fontSize: '11px',

      lineHeight: '1.4',

      color: '#6b7280',

      marginBottom: '16px'

    }
  );


  panel.appendChild(
    explanation
  );


  const fields = [

    {
      key: 'Soba',
      label: 'Soba'
    },

    {
      key: 'Ime_pacienta',
      label: 'Pacient'
    },

    {
      key: 'Datum_sprejema',
      label: 'Sprejem'
    },

    {
      key: 'Dg',
      label: 'Dg'
    },

    {
      key: 'Plan',
      label: 'Plan'
    },

    {
      key: 'R',
      label: 'R'
    }

  ];


  const inputs = {};


  fields.forEach(
    field => {

      const row =
        document.createElement('div');


      Object.assign(
        row.style,
        {

          display: 'flex',

          alignItems: 'center',

          justifyContent: 'space-between',

          gap: '12px',

          marginBottom: '9px'

        }
      );


      const label =
        document.createElement('label');


      label.textContent =
        field.label;


      Object.assign(
        label.style,
        {

          fontSize: '12px',

          flex: '1'

        }
      );


      const input =
        document.createElement('input');


      input.type =
        'number';


      input.min =
        '0.1';


      input.step =
        '0.5';


      input.value =
        columnWidths[field.key];


      Object.assign(
        input.style,
        {

          width: '80px',

          height: '32px',

          padding: '5px 8px',

          border:
            '1px solid #d1d5db',

          borderRadius: '4px',

          fontSize: '13px',

          textAlign: 'right'

        }
      );


      row.appendChild(label);

      row.appendChild(input);


      panel.appendChild(row);


      inputs[field.key] =
        input;

    }
  );


  const folderSection =
    document.createElement('div');


  Object.assign(
    folderSection.style,
    {

      marginTop: '6px',

      marginBottom: '4px',

      paddingTop: '14px',

      borderTop: '1px solid #e5e7eb'

    }
  );


  const folderTitle =
    document.createElement('div');


  folderTitle.textContent =
    'Mapa za shranjevanje PDF';


  Object.assign(
    folderTitle.style,
    {

      fontSize: '13px',

      fontWeight: '700',

      marginBottom: '4px'

    }
  );


  folderSection.appendChild(
    folderTitle
  );


  const folderStatus =
    document.createElement('div');


  folderStatus.id =
    'folderStatus';


  Object.assign(
    folderStatus.style,
    {

      fontSize: '11px',

      color: '#6b7280',

      lineHeight: '1.4',

      marginBottom: '8px'

    }
  );


  folderStatus.textContent =
    'Nalaganje …';


  folderSection.appendChild(
    folderStatus
  );


  const folderButton =
    document.createElement('button');


  folderButton.type =
    'button';


  folderButton.textContent =
    'Izberi mapo …';


  Object.assign(
    folderButton.style,
    {

      height: '32px',

      padding: '0 12px',

      border: '1px solid #d1d5db',

      background: '#ffffff',

      borderRadius: '5px',

      cursor: 'pointer',

      fontSize: '12px',

      fontWeight: '600'

    }
  );


  folderButton.onclick =
    () => chooseSaveFolder(folderStatus);


  folderSection.appendChild(
    folderButton
  );


  panel.appendChild(
    folderSection
  );


  if (window.showDirectoryPicker) {

    getSavedDirHandle().then(
      handle => {

        folderStatus.textContent =
          handle
            ? `Izbrana mapa: ${handle.name}`
            : 'Mapa še ni izbrana – uporabljena bo privzeta mapa za prenose.';

      }
    );

  } else {

    folderStatus.textContent =
      'Izbira mape ni podprta v tem brskalniku/oknu (potreben je Chrome ali Edge). ' +
      'PDF bo namesto tega prenesen v privzeto mapo za prenose.';


    folderButton.disabled =
      true;


    Object.assign(
      folderButton.style,
      {

        opacity: '0.5',

        cursor: 'not-allowed'

      }
    );

  }


  const buttons =
    document.createElement('div');


  Object.assign(
    buttons.style,
    {

      display: 'flex',

      justifyContent: 'flex-end',

      gap: '8px',

      marginTop: '18px',

      paddingTop: '14px',

      borderTop:
        '1px solid #e5e7eb'

    }
  );


  const cancel =
    document.createElement('button');


  cancel.textContent =
    'Prekliči';


  Object.assign(
    cancel.style,
    {

      height: '34px',

      padding: '0 14px',

      border:
        '1px solid #d1d5db',

      background: '#ffffff',

      borderRadius: '5px',

      cursor: 'pointer',

      fontWeight: '600'

    }
  );


  cancel.onclick =
    () => {

      overlay.remove();

    };


  const save =
    document.createElement('button');


  save.textContent =
    'Shrani';


  Object.assign(
    save.style,
    {

      height: '34px',

      padding: '0 16px',

      border: '0',

      background: '#111827',

      color: '#ffffff',

      borderRadius: '5px',

      cursor: 'pointer',

      fontWeight: '700'

    }
  );


  save.onclick =
    async () => {

      const newWidths = {};


      fields.forEach(
        field => {

          newWidths[field.key] =
            getWidth(
              inputs[field.key].value,
              DEFAULT_WIDTHS[field.key]
            );

        }
      );


      await grist.setOptions(
        {
          columnWidths:
            newWidths
        }
      );


      columnWidths =
        newWidths;


      applyColumnWidths();


      overlay.remove();

    };


  buttons.appendChild(cancel);

  buttons.appendChild(save);


  panel.appendChild(buttons);


  overlay.appendChild(panel);


  document.body.appendChild(overlay);

}


/* =========================================================
   LOAD SAVED OPTIONS
   ========================================================= */

grist.onOptions(
  function(options) {

    if (
      !options ||
      !options.columnWidths
    ) {

      columnWidths =
        {
          ...DEFAULT_WIDTHS
        };


      applyColumnWidths();

      return;

    }


    const saved =
      options.columnWidths;


    columnWidths = {

      Soba:
        getWidth(
          saved.Soba,
          DEFAULT_WIDTHS.Soba
        ),

      Ime_pacienta:
        getWidth(
          saved.Ime_pacienta,
          DEFAULT_WIDTHS.Ime_pacienta
        ),

      Datum_sprejema:
        getWidth(
          saved.Datum_sprejema,
          DEFAULT_WIDTHS.Datum_sprejema
        ),

      Dg:
        getWidth(
          saved.Dg,
          DEFAULT_WIDTHS.Dg
        ),

      Plan:
        getWidth(
          saved.Plan,
          DEFAULT_WIDTHS.Plan
        ),

      R:
        getWidth(
          saved.R,
          DEFAULT_WIDTHS.R
        )

    };


    applyColumnWidths();

  }
);


/* =========================================================
   DATE FORMATTER
   ========================================================= */

function formatDate(value) {

  if (
    value === null ||
    value === undefined ||
    value === ''
  ) {

    return '';

  }


  if (value instanceof Date) {

    return formatDateObject(value);

  }


  if (typeof value === 'number') {

    let date =
      new Date(
        value * 1000
      );


    if (
      !isNaN(
        date.getTime()
      )
    ) {

      return formatDateObject(date);

    }


    date =
      new Date(value);


    if (
      !isNaN(
        date.getTime()
      )
    ) {

      return formatDateObject(date);

    }

  }


  if (typeof value === 'string') {

    let date =
      new Date(value);


    if (
      !isNaN(
        date.getTime()
      )
    ) {

      return formatDateObject(date);

    }


    const match =
      value.match(
        /^(\d{1,2})[.\-/](\d{1,2})[.\-/](\d{4})$/
      );


    if (match) {

      const day =
        Number(match[1]);

      const month =
        Number(match[2]);

      const year =
        Number(match[3]);


      date =
        new Date(
          year,
          month - 1,
          day
        );


      if (
        !isNaN(
          date.getTime()
        )
      ) {

        return formatDateObject(date);

      }

    }

  }


  return String(value);

}


/* =========================================================
   DATE OBJECT → DD. MM. YYYY
   ========================================================= */

function formatDateObject(date) {

  const day =
    String(
      date.getDate()
    ).padStart(2, '0');


  const month =
    String(
      date.getMonth() + 1
    ).padStart(2, '0');


  const year =
    String(
      date.getFullYear()
    ).slice(-2);


  return `${day}. ${month}. ${year}`;

}


/* =========================================================
   CURRENT DATE/TIME
   ========================================================= */

function formatCurrentDate() {

  const now =
    new Date();


  const day =
    String(
      now.getDate()
    ).padStart(2, '0');


  const month =
    String(
      now.getMonth() + 1
    ).padStart(2, '0');


  const year =
    now.getFullYear();


  const hours =
    String(
      now.getHours()
    ).padStart(2, '0');


  const minutes =
    String(
      now.getMinutes()
    ).padStart(2, '0');


  return `${day}. ${month}. ${year} ob ${hours}:${minutes}`;

}


/* =========================================================
   VALUE TO TEXT
   ========================================================= */

function valueToText(value) {

  if (
    value === null ||
    value === undefined
  ) {

    return '';

  }


  if (Array.isArray(value)) {

    return value.join(', ');

  }


  return String(value);

}


/* =========================================================
   ROOM SORT VALUE
   ========================================================= */

function roomSortValue(value) {

  const text =
    valueToText(value).trim();


  if (!text) {

    return {

      empty: true,

      number: Infinity,

      text: ''

    };

  }


  const number =
    Number(text);


  if (!isNaN(number)) {

    return {

      empty: false,

      number: number,

      text: text

    };

  }


  return {

    empty: false,

    number: Infinity,

    text: text

  };

}


/* =========================================================
   SORT RECORDS BY SOBA
   ========================================================= */

function sortByRoom(records) {

  return records.slice().sort(
    (a, b) => {

      const roomA =
        roomSortValue(
          a.Soba
        );


      const roomB =
        roomSortValue(
          b.Soba
        );


      if (
        roomA.number !== Infinity ||
        roomB.number !== Infinity
      ) {

        if (
          roomA.number !== roomB.number
        ) {

          return (
            roomA.number -
            roomB.number
          );

        }

      }


      if (
        roomA.empty !== roomB.empty
      ) {

        return roomA.empty
          ? 1
          : -1;

      }


      return roomA.text.localeCompare(
        roomB.text,
        'sl',
        {

          numeric: true,

          sensitivity: 'base'

        }
      );

    }
  );

}


/* =========================================================
   CREATE CELL
   ========================================================= */

function createCell(
  value,
  className = ''
) {

  const td =
    document.createElement('td');


  const text =
    valueToText(value).trim();


  if (text === '') {

    td.classList.add('empty');

    td.textContent = '—';

  }

  else {

    td.textContent = text;

  }


  if (className) {

    td.classList.add(className);

  }


  return td;

}


/* =========================================================
   BUILD COMBINED "PACIENT" CELL (Ime_pacienta, Leto_rojstva)
   ========================================================= */

function buildPatientCell(record) {

  const td =
    document.createElement('td');


  const name =
    valueToText(
      record.Ime_pacienta
    ).trim();


  const year =
    valueToText(
      record.Leto_rojstva
    ).trim();


  if (!name && !year) {

    td.classList.add('empty');

    td.textContent = '—';

    return td;

  }


  if (name) {

    const nameSpan =
      document.createElement('span');


    nameSpan.classList.add(
      'patient-name'
    );


    nameSpan.textContent =
      name;


    td.appendChild(nameSpan);

  }


  if (name && year) {

    td.appendChild(
      document.createTextNode(
        `, ${year}`
      )
    );

  }

  else if (year) {

    td.appendChild(
      document.createTextNode(
        year
      )
    );

  }


  return td;

}


/* =========================================================
   RENDER TABLE
   ========================================================= */

function renderTable() {

  const tbody =
    document.getElementById(
      'tableBody'
    );


  const emptyState =
    document.getElementById(
      'emptyState'
    );


  if (!tbody) {

    return;

  }


  tbody.innerHTML = '';


  const sortedRecords =
    sortByRoom(
      allRecords
    );


  let previousRoom =
    null;


  sortedRecords.forEach(
    (record, index) => {

      const tr =
        document.createElement('tr');


      const currentRoom =
        valueToText(
          record.Soba
        ).trim();


      if (
        index > 0 &&
        currentRoom !== previousRoom
      ) {

        tr.classList.add(
          'room-change'
        );

      }


      tr.appendChild(
        createCell(
          record.Soba,
          'room-number'
        )
      );


      tr.appendChild(
        buildPatientCell(record)
      );


      tr.appendChild(
        createCell(
          formatDate(
            record.Datum_sprejema
          )
        )
      );


      tr.appendChild(
        createCell(
          record.Dg
        )
      );


      tr.appendChild(
        createCell(
          record.Plan
        )
      );


      tr.appendChild(
        createCell(
          record.R,
          'center'
        )
      );


      tbody.appendChild(tr);


      previousRoom =
        currentRoom;

    }
  );


  if (emptyState) {

    emptyState.style.display =
      allRecords.length === 0
        ? 'block'
        : 'none';

  }


  const count =
    allRecords.length;


  const countText =
    `${count} ${
      count === 1
        ? 'pacient'
        : 'pacientov'
    }`;


  const reportCount =
    document.getElementById(
      'reportCount'
    );


  if (reportCount) {

    reportCount.textContent =
      countText;

  }


  const footerCount =
    document.getElementById(
      'footerCount'
    );


  if (footerCount) {

    footerCount.textContent =
      countText;

  }

}


/* =========================================================
   UPDATE TITLE ("Predaja [Poletaza]")
   ========================================================= */

function updateTitle() {

  const titleEl =
    document.getElementById(
      'reportTitle'
    );


  if (!titleEl) {

    return;

  }


  const firstRecord =
    allRecords[0];


  const label =
    firstRecord
      ? valueToText(
          firstRecord.Poletaza
        ).trim()
      : '';


  titleEl.textContent =
    label
      ? `Predaja ${label}`
      : 'Predaja';

}


/* =========================================================
   PRINT
   ========================================================= */

function printReport() {

  renderTable();

  applyColumnWidths();

  updateTitle();


  setTimeout(
    () => {

      window.print();

    },
    100
  );

}


/* =========================================================
   PRINT BUTTON
   ========================================================= */

const printButton =
  document.getElementById(
    'printButton'
  );


if (printButton) {

  printButton.addEventListener(
    'click',
    printReport
  );

}


/* =========================================================
   SAVE FOLDER (File System Access API + IndexedDB)
   =========================================================

   The folder is chosen once, from the Creator Panel ("Izberi
   mapo …" inside the column-width settings dialog), using
   window.showDirectoryPicker(). The returned handle is stored
   in this widget's own IndexedDB (handles are not JSON, so they
   can't go through grist.setOptions) and reused on later saves.

   This API is Chromium-only (Chrome/Edge) and may be blocked
   entirely inside Grist's widget iframe depending on the
   browser's permissions policy. When unavailable, or when the
   stored folder can't be written to anymore, saving falls back
   to the browser's native "Save As" dialog, and finally to a
   plain download.
*/

const SAVE_DB_NAME = 'predaja-widget-db';
const SAVE_DB_STORE = 'handles';
const SAVE_DB_KEY = 'saveFolder';

function openHandleDB() {

  return new Promise(
    (resolve, reject) => {

      const req =
        indexedDB.open(SAVE_DB_NAME, 1);


      req.onupgradeneeded =
        () => {

          req.result.createObjectStore(
            SAVE_DB_STORE
          );

        };


      req.onsuccess =
        () => resolve(req.result);


      req.onerror =
        () => reject(req.error);

    }
  );

}

async function getSavedDirHandle() {

  if (!window.showDirectoryPicker) {

    return null;

  }


  try {

    const db =
      await openHandleDB();


    return await new Promise(
      (resolve, reject) => {

        const tx =
          db.transaction(SAVE_DB_STORE, 'readonly');

        const req =
          tx.objectStore(SAVE_DB_STORE).get(SAVE_DB_KEY);


        req.onsuccess =
          () => resolve(req.result || null);


        req.onerror =
          () => reject(req.error);

      }
    );

  } catch (e) {

    return null;

  }

}

async function setSavedDirHandle(handle) {

  const db =
    await openHandleDB();


  return new Promise(
    (resolve, reject) => {

      const tx =
        db.transaction(SAVE_DB_STORE, 'readwrite');


      tx.objectStore(SAVE_DB_STORE).put(
        handle,
        SAVE_DB_KEY
      );


      tx.oncomplete =
        () => resolve();


      tx.onerror =
        () => reject(tx.error);

    }
  );

}

async function chooseSaveFolder(statusEl) {

  if (!window.showDirectoryPicker) {

    if (statusEl) {

      statusEl.textContent =
        'Izbira mape ni podprta v tem brskalniku/oknu.';

    }


    return null;

  }


  try {

    const handle =
      await window.showDirectoryPicker(
        { mode: 'readwrite' }
      );


    await setSavedDirHandle(handle);


    if (statusEl) {

      statusEl.textContent =
        `Izbrana mapa: ${handle.name}`;

    }


    return handle;

  } catch (e) {

    if (statusEl) {

      statusEl.textContent =
        'Izbira mape ni uspela ali je bila preklicana.';

    }


    return null;

  }

}


/* =========================================================
   SAVE AS PDF
   ========================================================= */

function getPoletazaLabel() {

  const firstRecord =
    allRecords[0];


  return firstRecord
    ? valueToText(firstRecord.Poletaza).trim()
    : '';

}

function sanitizeFilename(text) {

  const cleaned =
    String(text || '')
      .replace(/[\\/:*?"<>|]+/g, '-')
      .trim();


  return cleaned || 'Predaja';

}

function buildPdfFilename() {

  const today =
    new Date();


  const dd =
    String(today.getDate()).padStart(2, '0');


  const mm =
    String(today.getMonth() + 1).padStart(2, '0');


  const yy =
    String(today.getFullYear()).slice(-2);


  const label =
    sanitizeFilename(
      getPoletazaLabel() || 'Predaja'
    );


  return `${label}-${dd}${mm}${yy}.pdf`;

}

async function generatePdfBlob() {

  const { jsPDF } =
    window.jspdf;


  const paper =
    document.querySelector('.paper');

  const toolbar =
    document.querySelector('.toolbar');


  // Temporarily strip the on-screen chrome (toolbar, card shadow,
  // centered max-width) so the capture matches the printed page.
  const prevToolbarDisplay =
    toolbar.style.display;

  const prevBoxShadow =
    paper.style.boxShadow;

  const prevMargin =
    paper.style.margin;

  const prevMaxWidth =
    paper.style.maxWidth;


  toolbar.style.display = 'none';
  paper.style.boxShadow = 'none';
  paper.style.margin = '0';
  paper.style.maxWidth = 'none';


  const doc =
    new jsPDF(
      { orientation: 'landscape', unit: 'mm', format: 'a4' }
    );


  try {

    await new Promise(
      (resolve) => {

        doc.html(
          paper,
          {
            x: 10,
            y: 10,
            width: 277,
            windowWidth: paper.scrollWidth,
            autoPaging: 'text',
            html2canvas: { scale: 2, useCORS: true },
            callback: () => resolve(),
          }
        );

      }
    );

  } finally {

    toolbar.style.display = prevToolbarDisplay;
    paper.style.boxShadow = prevBoxShadow;
    paper.style.margin = prevMargin;
    paper.style.maxWidth = prevMaxWidth;

  }


  return doc.output('blob');

}

async function saveReport() {

  const statusEl =
    document.getElementById('saveStatus');

  const saveBtn =
    document.getElementById('saveButton');


  renderTable();
  applyColumnWidths();
  updateTitle();


  if (statusEl) statusEl.textContent = 'Ustvarjanje PDF …';
  if (saveBtn) saveBtn.disabled = true;


  try {

    const blob =
      await generatePdfBlob();

    const filename =
      buildPdfFilename();


    // 1) The folder configured in the Creator Panel.
    const dirHandle =
      await getSavedDirHandle();


    if (dirHandle) {

      try {

        const current =
          await dirHandle.queryPermission(
            { mode: 'readwrite' }
          );


        const granted =
          current === 'granted'
            ? true
            : (await dirHandle.requestPermission(
                { mode: 'readwrite' }
              )) === 'granted';


        if (granted) {

          const fileHandle =
            await dirHandle.getFileHandle(
              filename,
              { create: true }
            );


          const writable =
            await fileHandle.createWritable();


          await writable.write(blob);
          await writable.close();


          if (statusEl) {

            statusEl.textContent =
              `Shranjeno v "${dirHandle.name}" kot ${filename}`;

          }


          return;

        }

      } catch (e) {

        // Folder no longer accessible - fall through to the
        // next strategy below.

      }

    }


    // 2) The browser's native "Save As" dialog, if supported.
    if (window.showSaveFilePicker) {

      try {

        const handle =
          await window.showSaveFilePicker(
            {
              suggestedName: filename,
              types: [
                {
                  description: 'PDF',
                  accept: { 'application/pdf': ['.pdf'] }
                }
              ]
            }
          );


        const writable =
          await handle.createWritable();


        await writable.write(blob);
        await writable.close();


        if (statusEl) {

          statusEl.textContent =
            `Shranjeno kot ${filename}`;

        }


        return;

      } catch (e) {

        // User cancelled, or unsupported here - fall through.

      }

    }


    // 3) Last resort: a normal browser download.
    const url =
      URL.createObjectURL(blob);

    const a =
      document.createElement('a');


    a.href = url;
    a.download = filename;

    document.body.appendChild(a);
    a.click();
    a.remove();

    URL.revokeObjectURL(url);


    if (statusEl) {

      statusEl.textContent =
        dirHandle
          ? `Izbrana mapa ni dosegljiva – ${filename} prenesen v privzeto mapo za prenose.`
          : `${filename} prenesen v privzeto mapo za prenose.`;

    }

  } catch (e) {

    if (statusEl) {

      statusEl.textContent =
        'Napaka pri ustvarjanju PDF.';

    }


    console.error(e);

  } finally {

    if (saveBtn) saveBtn.disabled = false;

  }

}

const saveButton =
  document.getElementById(
    'saveButton'
  );


if (saveButton) {

  saveButton.addEventListener(
    'click',
    saveReport
  );

}


/* =========================================================
   RECEIVE RECORDS FROM GRIST
   ========================================================= */

grist.onRecords(
  function(records) {

    allRecords =
      Array.isArray(records)
        ? records.slice()
        : [];


    const reportDate =
      document.getElementById(
        'reportDate'
      );


    if (reportDate) {

      reportDate.textContent =
        `Izdelano: ${formatCurrentDate()}`;

    }


    renderTable();


    applyColumnWidths();


    updateTitle();

  }
);


/* =========================================================
   INITIAL DATE
   ========================================================= */

const reportDate =
  document.getElementById(
    'reportDate'
  );


if (reportDate) {

  reportDate.textContent =
    `Izdelano: ${formatCurrentDate()}`;

}


/* =========================================================
   INITIAL COLUMN WIDTHS
   ========================================================= */

applyColumnWidths();

  </script>
